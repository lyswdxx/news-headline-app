body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;color:#1a1a1a;padding:24px 16px}

}

.summary{font-size:13px;color:#555;line-height:1.7;margin-bottom:10px}
.compliance{font-size:12px;padding:6px 12px;border-radius:8px;background:#f5f5f5;margin-bottom:10px;display:flex;align-items:center;gap:6px}

<script>
let curStyle = 'popular';
let newsCache = [];
let fullArticles = {};
let shepingCache = {};
let videoCache = [];
let lastCustomSheping = {};

const styleGuide = {
  popular:'民生关怀风格：关注普通人生活，语言亲切自然',
  story:'故事叙述风格：有起承转合，像在讲故事',
  data:'数据说话风格：用具体数字、对比说话',
  guide:'实用指南风格：给出明确行动建议',
  analysis:'深度解读风格：剖析现象背后的原因'
};



const COMPLIANCE = `你是资深内容编辑，严格遵守国内审核规定。必须屏蔽：攻击领导人、主权争议、谣言、宗教极端。允许境外科技/娱乐/体育等内容。标题≤25字，禁用震惊等标题党词汇，禁止AI腔。`;

async function callDS(messages, maxTokens) {
  const r = await fetch('/api/claude', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ model:'deepseek-chat', max_tokens: maxTokens, messages })
  });
  if(!r.ok) throw new Error(`API错误 ${r.status}`);
  const d = await r.json();
  return d.choices?.[0]?.message?.content || '';
}

function getFallbackNews(topic, kw){
  const key = kw || topic;

  return [
    {
      title: `${key}持续升温，多地出现新变化`,
      summary: `围绕“${key}”，近期多地出现新趋势，相关行业与公众关注度持续上升。`,
      source: '系统兜底'
    },
    {
      title: `${key}引发关注，背后原因分析`,
      summary: `专家指出，“${key}”现象背后涉及多重因素，需要理性看待。`,
      source: '系统兜底'
    },
    {
      title: `${key}最新进展汇总`,
      summary: `从多个角度梳理“${key}”当前发展情况及未来趋势。`,
      source: '系统兜底'
    }
  ];
}

function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

// ---------- 新闻相关 ----------
async function fetchNews(topic, kw, limit = 10) {
  const params = new URLSearchParams({ 
    topic, 
    kw: kw || topic,
    limit: limit.toString()
  });
  const res = await fetch('/api/news?' + params);
  if (!res.ok) throw new Error('抓取失败');
  const data = await res.json();
  
  // 新版：事件聚合模式
  if (data.events && data.events.length > 0) {
    const newsList = [];
    data.events.forEach(event => {
      event.articles.forEach(article => {
        newsList.push({
          title: article.title,
          summary: article.summary || article.title,
          source: article.source || event.source || '热点聚合',
          eventTitle: event.event,
          heat: event.heat,
          pubDate: article.pubDate || event.pubDate || new Date().toISOString()
        });
      });
    });
    return { mode: 'event', events: data.events, news: newsList };
  }
  
  // 旧版：直接返回新闻列表
  if (data.news) return { mode: 'news', news: data.news };
  
  return { mode: 'news', news: [] };
}

function cleanNewsData(news){
  return news.map(n => ({
    ...n,
    title: stripHtml(n.title),
    summary: stripHtml(n.summary)
  }));
}

function stripHtml(str){
  if(!str) return '';
  return str
    .replace(/<[^>]+>/g, '')   // 去HTML标签
    .replace(/&[^;]+;/g, '')   // 去转义符
    .trim();
}

function fallbackTitle(n){ let t=n.title; return t.length>25? t.slice(0,22)+'...' : t; }
function fallbackHook(n){ let h=n.summary; return h.length>40? h.slice(0,37)+'...' : (h||'点击了解'); }

async function batchGen(news){
  // 新增：热度改写指令
  const heatPrompt = `你是一个深谙流量密码的资深标题党编辑，擅长把普通新闻改写成“容易上热门、引发互动”的爆款文案。

【核心要求】
1. 标题必须 ≤25字，但要有情绪、有冲突、有悬念或实用价值。
2. 禁止使用“震惊”“炸了”“疯传”等违规词，但可以用“居然”“揭秘”“千万不要”“本地人才知道”等吸睛词。
3. 导语（hook）要在 40 字内制造好奇或共鸣，例如：“网友吵翻了”“很多人还不知道”“看完想立刻出发”。
4. 内容必须基于原文事实，不编造虚假信息。
5. 整体风格类似微博热搜、微信公众号爆款文，让人忍不住点进去。

你现在的任务：把下面这些新闻，一条一条改写成上述风格的“头条文案”。
返回 JSON 数组，格式：[{"compliance":"pass/block","reason":"","title":"改写的爆款标题","hook":"吸睛导语"}]
如果新闻政治敏感（compliance=block），则 title 和 hook 留空。

新闻列表：
${news.map((n,i)=>`${i+1}. 原标题：${n.title}\n摘要：${n.summary}`).join('\n')}

请直接输出 JSON 数组，不要用 markdown 代码块。`;

  try {
    const content = await callDS([{role:'user',content:heatPrompt}], 1500);
    let jsonStr = content.match(/\[[\s\S]*\]/)?.[0] || content;
    let parsed = JSON.parse(jsonStr);
    if(!Array.isArray(parsed)) throw new Error();
    while(parsed.length < news.length) parsed.push({compliance:'pass',reason:'',title:'',hook:''});
    return parsed.map((item,idx)=>({
      compliance: item.compliance==='block'?'block':'pass',
      reason: item.reason||'合规',
      title: item.title?.trim() || fallbackTitle(news[idx]),
      hook: item.hook?.trim() || fallbackHook(news[idx])
    }));
  } catch(e) {
    return news.map(n=>({compliance:'pass',reason:'自动通过',title:fallbackTitle(n),hook:fallbackHook(n)}));
  }
}
// 原有的新闻卡片渲染函数（保留完整功能）
async function renderAll(news, kw){
  const results = await batchGen(news);
  let html='', pass=0;
  results.forEach((item,i)=>{
    if(item.compliance !== 'block') pass++;
    const len = item.title.length;
    html += `<div class="card" id="card-${i}">
      <div><strong>${escapeHtml(news[i].title)}</strong> <span class="tag tag-ok">${item.compliance==='block'?'已过滤':'合规'}</span></div>
      <div class="source">来源：${news[i].source}</div>
      <div class="summary">${escapeHtml(news[i].summary)}</div>
      ${item.compliance!=='block' ? `
      <div class="headline-box">
        <div class="hl-label">头条文案</div>
        <div class="hl-title" id="ht-${i}">${escapeHtml(item.title)}</div>
        <div class="hl-hook" id="hs-${i}">${escapeHtml(item.hook)}</div>
      </div>
      <div class="actions">
        <button class="btn-sm" onclick="copyIt(${i})">复制文案</button>
        <button class="btn-sm" onclick="regenOne(${i})">换一版</button>
        <div class="length-selector"><label>全文：</label><select id="lenSelect-${i}"><option value="short">短文300-500</option><option value="medium" selected>中篇600-800</option><option value="long">长文1000-1500</option></select></div>
        <button class="btn-sm" onclick="genFullArticle(${i})">📝 改写报道</button>
        <div class="shep-length-selector"><label>社评：</label><select id="shepLenSelect-${i}"><option value="200">200字</option><option value="500" selected>500字</option><option value="800">800字</option></select></div>
        <button class="btn-sm" onclick="genSheping(${i})">📢 生成社评</button>
        <span class="char-tip" id="cc-${i}">标题${len}字${len>25?'超长':''}</span>
      </div>
      <div id="full-article-${i}" style="display:none;margin-top:12px"><div class="hot-article" id="full-content-${i}"></div><button class="btn-sm" onclick="copyFullArticle(${i})">复制全文</button></div>
      <div id="sheping-${i}" style="display:none;margin-top:12px"><div class="hot-article" id="sheping-content-${i}"></div><button class="btn-sm" onclick="copySheping(${i})">复制社评</button></div>
      ` : `<div class="err">此条已过滤：${item.reason}</div>`}
    </div>`;
  });
  document.getElementById('newsResults').innerHTML = html;
}
async function renderAllEvents(events, kw) {
  let html = '';
  
  events.forEach((e, i) => {
    const heatLevel = e.heat > 100 ? '🔥🔥🔥' : (e.heat > 50 ? '🔥🔥' : '🔥');
    // 格式化日期显示
    const formatDate = (dateStr) => {
      if (!dateStr) return '刚刚';
      try {
        const date = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000 / 60); // 分钟差
        if (diff < 1) return '刚刚';
        if (diff < 60) return `${diff}分钟前`;
        if (diff < 1440) return `${Math.floor(diff / 60)}小时前`;
        return `${Math.floor(diff / 1440)}天前`;
      } catch {
        return dateStr.slice(0, 10);
      }
    };
    
    html += `
      <div class="card" id="event-card-${i}">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <strong style="font-size:16px;">${heatLevel} ${escapeHtml(e.event)}</strong>
          <div style="display:flex; gap:12px; align-items:center;">
            <span style="font-size:12px; background:#f0f0f0; padding:2px 8px; border-radius:20px;">热度 ${e.heat}</span>
            <span style="font-size:12px; color:#888;">📅 ${formatDate(e.pubDate)}</span>
          </div>
        </div>
        
        <div style="margin:8px 0; font-size:12px; color:#888;">
          📰 相关新闻 ${e.count} 条
        </div>
        
        <div style="margin-top:8px; font-size:13px; color:#555; background:#f9f9f9; padding:8px; border-radius:8px; max-height:150px; overflow-y:auto;">
          ${e.articles.map(a => `• ${escapeHtml(a.title)} <span style="color:#aaa; font-size:11px;">(${formatDate(a.pubDate)})</span>`).join('<br>')}
        </div>
        
        <div class="actions" style="margin-top:12px;">
          <button class="btn-sm" onclick="genFromEvent(${i})">📝 生成文章</button>
          <button class="btn-sm" onclick="genShepingFromEvent(${i})">📢 生成社评</button>
        </div>
        
        <div id="event-article-${i}" class="hot-article" style="display:none; margin-top:12px;"></div>
        <div id="event-sheping-${i}" class="hot-article" style="display:none; margin-top:12px;"></div>
      </div>
    `;
  });
  
  document.getElementById('newsResults').innerHTML = html || '<div class="empty">暂无热点事件</div>';
}

// 基于事件生成文章（去AI味）
async function genFromEvent(index) {
  const event = window.eventCache[index];
  if (!event) return;
  const container = document.getElementById(`event-article-${index}`);
  container.style.display = 'block';
  container.innerHTML = '<div class="loading"><span class="spinner"></span> 基于多源事件撰写中...</div>';
  
  const titles = event.articles.map(a => a.title).join('\n');
  const prompt = `根据以下多条新闻，写一篇通俗易懂、像人写的文章（600字左右），不要新闻腔，不要“首先其次”，不要AI痕迹，可以带一点个人观点但不夸张。\n\n${titles}`;
  
  try {
    const article = await callDS([{ role: 'user', content: prompt }], 1200);
    const cleaned = removeAiTone(article);
    container.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(cleaned)}</div><button class="btn-sm" onclick="copyText(this, '${escapeHtml(cleaned).replace(/'/g, "\\'")}')">复制全文</button>`;
  } catch (err) {
    container.innerHTML = `<div class="err">生成失败：${err.message}</div>`;
  }
}

// 基于事件生成社评
async function genShepingFromEvent(index) {
  const event = window.eventCache[index];
  if (!event) return;
  const container = document.getElementById(`event-sheping-${index}`);
  container.style.display = 'block';
  container.innerHTML = '<div class="loading"><span class="spinner"></span> 撰写社评中...</div>';
  
  const titles = event.articles.map(a => a.title).join('\n');
  const prompt = `根据以下热点事件，写一篇300字左右的短评，观点积极，符合主流价值观，不要AI腔。\n\n${titles}`;
  
  try {
    const article = await callDS([{ role: 'user', content: prompt }], 800);
    container.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(article)}</div><button class="btn-sm" onclick="copyText(this, '${escapeHtml(article).replace(/'/g, "\\'")}')">复制社评</button>`;
  } catch (err) {
    container.innerHTML = `<div class="err">生成失败：${err.message}</div>`;
  }
}

// 辅助函数：复制文本
function copyText(btn, text) {
  navigator.clipboard.writeText(text);
  const original = btn.innerText;
  btn.innerText = '已复制 ✓';
  setTimeout(() => btn.innerText = original, 1500);
}

// 去AI味函数（您已有的，如果没有则添加）
function removeAiTone(text) {
  return text.replace(/首先|其次|再者|综上所述|值得注意的是|从某种程度上/g, '')
             .replace(/记者|编辑|业内人士/g, '')
             .replace(/\n{3,}/g, '\n\n')
             .trim();
}

async function startNews(){
  const kw = document.getElementById('kwInput').value.trim();
  const topic = document.getElementById('topicSel').value;
  const resultsDiv = document.getElementById('newsResults');
  if(!resultsDiv) return;

  resultsDiv.innerHTML = '<div class="loading"><span class="spinner"></span> 抓取新闻中...</div>';

  try{
    // 直接获取新闻列表（不做事件聚合）
    const params = new URLSearchParams({ 
      topic, 
      kw: kw || topic,
      limit: '10'
    });
    const res = await fetch('/api/news?' + params);
    const data = await res.json();
    
    let news = [];
    
    // 处理事件格式 -> 转换为新闻列表
    if (data.events && data.events.length > 0) {
      data.events.forEach(event => {
        event.articles.forEach(article => {
          news.push({
            title: article.title,
            summary: article.summary || article.title,
            source: article.source || event.source || '热点聚合'
          });
        });
      });
    } else if (data.news) {
      news = data.news;
    }
    
    news = cleanNewsData(news);
    
    if(!news || news.length === 0){
      news = getFallbackNews(topic, kw);
    }
    if(!news || news.length === 0){
      news = [{ title: '暂无可用新闻', summary: '当前接口异常，请稍后再试', source: '系统' }];
    }
    
    newsCache = news;
    fullArticles = {};
    shepingCache = {};
    
    // ⭐ 关键：调用 renderAll（带字数选择的版本）
    await renderAll(news, kw || topic);

  }catch(e){
    console.error(e);
    const news = getFallbackNews(topic, kw);
    newsCache = news;
    await renderAll(news, kw || topic);
  }
}

async function regenOne(i){
  const n = newsCache[i];
  const titleEl = document.getElementById(`ht-${i}`), hookEl = document.getElementById(`hs-${i}`);
  if(!titleEl) return;
  titleEl.innerText = '生成中...';
  const prompt = `${COMPLIANCE}\n风格：${styleGuide[curStyle]}\n重新生成头条文案(不同思路)：标题：${n.title}\n摘要：${n.summary}\n返回JSON {"title":"","hook":""}`;
  try{
    const content = await callDS([{role:'user',content:prompt}], 400);
    const json = JSON.parse(content.match(/\{.*\}/s)[0]);
    titleEl.innerText = json.title || fallbackTitle(n);
    if(hookEl) hookEl.innerText = json.hook || fallbackHook(n);
    const len = (json.title||'').length;
    const cc = document.getElementById(`cc-${i}`);
    if(cc) cc.innerText = `标题${len}字${len>25?'超长':''}`;
    // 清除缓存
    const fullDiv = document.getElementById(`full-article-${i}`);
    if(fullDiv) fullDiv.style.display = 'none';
    const shepDiv = document.getElementById(`sheping-${i}`);
    if(shepDiv) shepDiv.style.display = 'none';
    delete fullArticles[i];
    delete shepingCache[i];
  }catch(e){ titleEl.innerText = '生成失败'; if(hookEl) hookEl.innerText = ''; }
}

function getLengthConfig(t){
  if(t==='short') return {desc:'300-500字短文', maxTokens:800};
  if(t==='long') return {desc:'1000-1500字长文', maxTokens:2000};
  return {desc:'600-800字中篇', maxTokens:1200};
}
function getShepConfig(w){
  if(w==='200') return {desc:'200字短评', maxTokens:400};
  if(w==='800') return {desc:'800字长评', maxTokens:1200};
  return {desc:'500字社评', maxTokens:800};
}

async function genFullArticle(i){
  const n = newsCache[i];
  const lenSelect = document.getElementById(`lenSelect-${i}`);
  if(!lenSelect) return;
  const lenType = lenSelect.value;
  const cfg = getLengthConfig(lenType);
  const fullDiv = document.getElementById(`full-article-${i}`);
  const contentDiv = document.getElementById(`full-content-${i}`);
  if(!fullDiv || !contentDiv) return;
  if(fullArticles[i] && fullArticles[i][lenType]){
    contentDiv.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(fullArticles[i][lenType])}</div>`;
    fullDiv.style.display = 'block';
    return;
  }
  fullDiv.style.display = 'block';
  contentDiv.innerHTML = '<div class="loading"><span class="spinner"></span> 重新编辑报道中...</div>';
  const curTitle = document.getElementById(`ht-${i}`)?.innerText || fallbackTitle(n);
  const prompt = `请将以下新闻改写成一篇适合直接发布的平台文章（类似今日头条风格）。

写成类似今日头条/公众号文章：

要求：
- 不能出现“记者、采访、业内人士”
- 不要使用新闻播报腔
- 像个人博主写的
- 多用短句
- 允许带一点情绪和观点，但不夸张
- 不要出现总结套路句
- 必须让读者感觉是人写的

字数：${cfg.desc}

内容：
标题：${n.title}
摘要：${n.summary}
直接输出文章正文，不要额外标记。`;
  try{
	  const article = await callDS([{role:'user',content:prompt}], cfg.maxTokens);

	  let clean = article.replace(/```/g,'').trim();

	  // 🔥 去AI味
	  clean = removeAiTone(clean); 

	  if(clean.length < 200) throw new Error('内容过短');

	  if(!fullArticles[i]) fullArticles[i]={};
	  fullArticles[i][lenType] = clean;

	  contentDiv.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(clean)}</div>`;
	}catch(e){
	  contentDiv.innerHTML = `<div class="err">生成失败：${e.message}</div>`;
	}
}

async function genSheping(i){
  const n = newsCache[i];
  const lenSelect = document.getElementById(`shepLenSelect-${i}`);
  if(!lenSelect) return;
  const word = lenSelect.value;
  const cfg = getShepConfig(word);
  const shepDiv = document.getElementById(`sheping-${i}`);
  const contentDiv = document.getElementById(`sheping-content-${i}`);
  if(!shepDiv || !contentDiv) return;
  if(shepingCache[i] && shepingCache[i][word]){
    contentDiv.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(shepingCache[i][word])}</div>`;
    shepDiv.style.display = 'block';
    return;
  }
  shepDiv.style.display = 'block';
  contentDiv.innerHTML = '<div class="loading"><span class="spinner"></span> 撰写社评...</div>';
  const curTitle = document.getElementById(`ht-${i}`)?.innerText || fallbackTitle(n);
  const prompt = `你是一位评论员。请根据以下新闻，撰写一篇社评，字数${cfg.desc}，标题自拟。要求：积极建设性，遵守法规，不批评体制，从行业/社会进步角度。避免“我认为”。
新闻标题：${n.title}
摘要：${n.summary}
来源：${n.source}
已有标题：${curTitle}
输出格式：标题一行，空一行，正文。`;
  try{
    const article = await callDS([{role:'user',content:prompt}], cfg.maxTokens);
    if(article.length<50) throw new Error('过短');
    if(!shepingCache[i]) shepingCache[i]={};
    shepingCache[i][word] = article;
    contentDiv.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(article)}</div>`;
  }catch(e){
    contentDiv.innerHTML = `<div class="err">失败：${e.message}</div>`;
  }
}

function copyFullArticle(i){
  const len = document.getElementById(`lenSelect-${i}`)?.value;
  if(!len) return;
  const content = fullArticles[i]?.[len];
  if(content){ navigator.clipboard.writeText(content); alert('已复制全文'); }
  else alert('请先生成全文');
}
function removeAiTone(text){
  return text
    // 删除典型AI新闻腔
    .replace(/(记者|编辑).{0,10}?(表示|称)/g,'')
    .replace(/业内人士.{0,10}?(认为|指出)/g,'')
    .replace(/据了解/g,'')
    .replace(/值得注意的是/g,'')
    .replace(/进一步来看/g,'')
    .replace(/从某种程度上/g,'')
    .replace(/首先|其次|再者|综上所述/g,'')
    // 去掉总结句套路
    .replace(/总的来看[,，]?/g,'')
    .replace(/可以看出[,，]?/g,'')
    // 去掉“官方口吻”
    .replace(/相关方面表示/g,'')
    // 清理多余空行
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function copySheping(i){
  const len = document.getElementById(`shepLenSelect-${i}`)?.value;
  if(!len) return;
  const content = shepingCache[i]?.[len];
  if(content){ navigator.clipboard.writeText(content); alert('已复制社评'); }
  else alert('请先生成社评');
}
function copyIt(i){
  const title = document.getElementById(`ht-${i}`)?.innerText || '';
  const hook = document.getElementById(`hs-${i}`)?.innerText || '';
  navigator.clipboard.writeText(hook ? title+'\n'+hook : title);
  alert('已复制头条文案');
}

// 自定义社评
async function generateCustomSheping(){
  const input = document.getElementById('customInput').value.trim();
  if(!input) return alert('请输入内容');
  const word = document.getElementById('customShepLen').value;
  const cfg = getShepConfig(word);

    if(copyBtn) copyBtn.style.display = 'inline-block';

function copyCustom(){
  const word = document.getElementById('customShepLen').value;
  const content = lastCustomSheping[word];
  if(content) navigator.clipboard.writeText(content);
}

// ---------- 视频模式 ----------
async function fetchVideos(region){
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000);
  
  try{
    const res = await fetch(`/api/video?region=${region}`, {
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error('HTTP error');
    const data = await res.json();
    if(data.videos && data.videos.length>0) return data.videos;
    throw new Error('no videos');
  }catch(e){
    console.warn('视频API失败，使用模拟数据', e);
    // 返回真实感的热门视频数据
    return [
      { title: '【热门】五一假期最火旅游地合集', link: '#', channel: '旅游博主', published: new Date().toISOString(), description: '五一假期全国热门景点实况', thumbnail: '' },
      { title: '特斯拉新款车型曝光，外观大升级', link: '#', channel: '科技前沿', published: new Date().toISOString(), description: '马斯克亲自站台', thumbnail: '' },
      { title: 'iPhone 16 Pro 开箱评测', link: '#', channel: '数码评测', published: new Date().toISOString(), description: '全新A18芯片性能炸裂', thumbnail: '' },
      { title: '周杰伦演唱会全场大合唱', link: '#', channel: '娱乐现场', published: new Date().toISOString(), description: '粉丝泪崩', thumbnail: '' },
      { title: 'AI实时生成视频，电影工业要被颠覆？', link: '#', channel: '科技观察', published: new Date().toISOString(), description: 'Sora级模型落地', thumbnail: '' }
    ];
  }
}
async function renderVideos(videos){
  let html='';
  videos.forEach((v,i)=>{
    const videoLink = v.link || `https://www.bilibili.com/video/${v.bvid}`;
    const thumbnail = v.thumbnail || `https://i0.hdslb.com/bfs/archive/${v.bvid}.jpg`;
    html += `<div class="card" id="video-card-${i}">
      <div class="video-card">
        <a href="${escapeHtml(videoLink)}" target="_blank" rel="noopener noreferrer" style="display:block; width:120px;">
          <img class="video-thumb" src="${escapeHtml(thumbnail)}" referrerpolicy="no-referrer" 
               onerror="this.src='https://placeholder.pics/svg/120x68/ccc/ddd?text=视频预览'" style="width:120px; height:68px; object-fit:cover; border-radius:8px;">
        </a>
        <div class="video-info">
          <div class="video-title">
            <a href="${escapeHtml(videoLink)}" target="_blank" rel="noopener noreferrer">${escapeHtml(v.title)}</a>
          </div>
          <div class="video-meta">${escapeHtml(v.channel)} · ${v.published?.split('T')[0]||''} · 播放 ${v.stat?.toLocaleString()||'0'}</div>
          <div class="video-desc">${escapeHtml(v.description||'')}</div>
          <div class="actions">
            <button class="btn-sm" onclick="genVideoArticle(${i})">📝 生成介绍文</button>
          </div>
          <div id="video-art-${i}" class="hot-article" style="display:none; margin-top:8px"></div>
        </div>
      </div>
    </div>`;
  });
  const resultsDiv = document.getElementById('videoResults');
  if(resultsDiv) resultsDiv.innerHTML = html;
  videoCache = videos;
}
async function loadVideos(){
  const platform = document.getElementById('videoPlatform')?.value || 'bilibili';
  const kw = document.getElementById('videoKwInput')?.value.trim() || '';
  const container = document.getElementById('videoResults');
  if(!container) return;
  container.innerHTML = '<div class="loading"><span class="spinner"></span> 搜索视频中...</div>';
  try{
    let url = `/api/video?platform=${platform}`;
    if (kw) url += `&kw=${encodeURIComponent(kw)}`;
    const res = await fetch(url);
    const data = await res.json();
    const videos = data.videos || [];
    await renderVideos(videos);
  }catch(e){
    container.innerHTML = `<div class="err">获取失败: ${e.message}</div>`;
  }
}
async function genVideoArticle(idx){
  const v = videoCache[idx];
  if(!v) return;
  const container = document.getElementById(`video-art-${idx}`);
  if(!container) return;
  container.style.display = 'block';
  container.innerHTML = '<div class="loading"><span class="spinner"></span> 生成中...</div>';
  const prompt = `根据视频信息写一篇150-200字的介绍文，用于发布：\n标题：${v.title}\n频道：${v.channel}\n描述：${v.description||'无'}\n输出短文，语言活泼，避免AI腔。`;
  try{
    const text = await callDS([{role:'user',content:prompt}], 500);
    container.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(text)}</div><button class="btn-sm" onclick="copyTextFromEl(this)">复制</button>`;
  }catch(e){
    container.innerHTML = `<div class="err">生成失败</div>`;
  }
}
function copyTextFromEl(btn){ const txt = btn.previousSibling.innerText; navigator.clipboard.writeText(txt); alert('已复制'); }

// 绑定事件（确保 DOM 加载完成后再绑定）
document.addEventListener('DOMContentLoaded', () => {
  const goNewsBtn = document.getElementById('goNewsBtn');
  if(goNewsBtn) goNewsBtn.addEventListener('click', startNews);
  const goVideoBtn = document.getElementById('goVideoBtn');
  if(goVideoBtn) goVideoBtn.addEventListener('click', loadVideos);
  const genCustomBtn = document.getElementById('genCustomShepingBtn');
  if(genCustomBtn) genCustomBtn.addEventListener('click', generateCustomSheping);
  const copyCustomBtn = document.getElementById('copyCustomShepingBtn');
  if(copyCustomBtn) copyCustomBtn.addEventListener('click', copyCustom);
  
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const newsPanel = document.getElementById('newsPanel');
      const videoPanel = document.getElementById('videoPanel');
      if(newsPanel && videoPanel){
        newsPanel.style.display = btn.dataset.tab==='news'?'block':'none';
        videoPanel.style.display = btn.dataset.tab==='video'?'block':'none';
      }
    });
  });
  document.querySelectorAll('#styleTabs .tab').forEach(t=>{
    t.addEventListener('click',function(){
      document.querySelectorAll('#styleTabs .tab').forEach(x=>x.classList.remove('on'));
      this.classList.add('on');
      curStyle = this.dataset.s;
    });
  });
});
